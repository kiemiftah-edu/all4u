                    return;

                    isHeader = activeSplitter.test(trimmed);

                    currentScene = { visual: visualContent, audio: "" };

                }

                }
            });

                                            <p className="text-sm text-slate-500 mt-1">{t('resultSubtitle')}</p>
                                        </div>
                                        <div className="bg-yellow-50 border-b border-yellow-100 p-3 text-sm text-yellow-800 text-center font-medium">{t('instruction')}</div>
                                        <div className="p-4 space-y-4">
                                            <div className="bg-white rounded-xl overflow-hidden border border-slate-200 shadow-lg">
                                                <div className="flex justify-between items-center p-3 bg-slate-50 border-b border-slate-200">
                                                    <span className="text-sm font-bold text-slate-700 flex items-center gap-2"><Icons.Settings className="w-4 h-4" /> {t('cover')}</span>
                                                    <button onClick={() => copyToClipboard(jsonOutput.cover, 'cover')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-bold transition-all ${copiedSection === 'cover' ? 'bg-green-500 text-white' : 'bg-slate-200 hover:bg-slate-300 text-slate-700'}`}>{copiedSection === 'cover' ? <Icons.Check className="w-3 h-3" /> : <Icons.Copy className="w-3 h-3" />} {copiedSection === 'cover' ? t('copied') : t('copy')}</button>
                                                </div>
                                                <pre className="p-3 text-sm font-mono text-slate-600 whitespace-pre-wrap leading-relaxed max-h-60 overflow-y-auto custom-scrollbar">{jsonOutput.cover}</pre>
                                            </div>
                                            {jsonOutput.boxes.map((boxData, idx) => (
                                                <div key={idx} className="mb-8">
                                                    {boxData.scenes.map((scene, sIdx) => (
                                                        <div key={sIdx} className="mb-6 last:mb-0">
                                                            {scene.imagePrompt && (
                                                                <div className="bg-white rounded-xl overflow-hidden border border-slate-200 shadow-lg mb-2">
                                                                    <div className="flex justify-between items-center p-3 bg-green-50 border-b border-green-100">
                                                                        <span className="text-sm font-bold text-green-700 flex items-center gap-2"><Icons.BookOpen className="w-4 h-4" /> {t('imageBoxLabel')} - {t('sceneLabel')} {scene.sceneNum}</span>
                                                                        <button onClick={() => copyToClipboard(scene.imagePrompt, `s-img-${scene.sceneNum}`)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-bold transition-all ${copiedSection === `s-img-${scene.sceneNum}` ? 'bg-green-600 text-white' : 'bg-green-100 hover:bg-green-200 text-green-800'}`}>{copiedSection === `s-img-${scene.sceneNum}` ? <Icons.Check className="w-3 h-3" /> : <Icons.Copy className="w-3 h-3" />} {copiedSection === `s-img-${scene.sceneNum}` ? t('copied') : t('copy')}</button>
                                                                    </div>
                                                                    <pre className="p-3 text-sm font-mono text-slate-600 whitespace-pre-wrap leading-relaxed">{scene.imagePrompt}</pre>
                                                                </div>
                                                            )}

                                                            {scene.videoPrompt && (
                                                                <div className="bg-indigo-50 rounded-xl overflow-hidden border border-indigo-200 shadow-lg ml-0 md:ml-4 border-l-4 border-l-indigo-400 mb-2">
                                                                    <div className="flex justify-between items-center p-3 bg-indigo-100 border-b border-indigo-200">
                                                                        <span className="text-sm font-bold text-indigo-700 flex items-center gap-2"><Icons.Video className="w-4 h-4" /> {t('videoPromptTitle')} - {t('sceneLabel')} {scene.sceneNum}</span>
                                                                        <button onClick={() => copyToClipboard(scene.videoPrompt, `s-vid-${scene.sceneNum}`)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-bold transition-all ${copiedSection === `s-vid-${scene.sceneNum}` ? 'bg-indigo-600 text-white' : 'bg-indigo-200 hover:bg-indigo-300 text-indigo-800'}`}>{copiedSection === `s-vid-${scene.sceneNum}` ? <Icons.Check className="w-3 h-3" /> : <Icons.Copy className="w-3 h-3" />} {copiedSection === `s-vid-${scene.sceneNum}` ? t('copied') : t('copy')}</button>
                                                                    </div>
                                                                    <pre className="p-3 text-sm font-mono text-indigo-900 whitespace-pre-wrap leading-relaxed">{scene.videoPrompt}</pre>
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            ))}
                                        </div>
                                        <div className="p-4 bg-slate-50 rounded-b-3xl border-t border-slate-100 text-center">
                                            <button onClick={() => setJsonOutput(null)} className="flex items-center justify-center gap-2 mx-auto px-6 py-2 bg-red-100 hover:bg-red-200 text-red-600 rounded-full font-bold text-sm transition-all shadow-sm">
                                                <Icons.Trash2 className="w-4 h-4" /> {t('clearResult')}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="w-full bg-indigo-950 p-4 text-center mt-auto border-t border-indigo-900/50">
                        <p className="text-xs text-indigo-300 tracking-wide">
                            AI.Comixs Prompter {new Date().getFullYear()}© {t('footerCredit')} <a href="https://www.tiktok.com/@kiemiftah" target="_blank" className="text-yellow-400 hover:text-yellow-300 underline font-bold transition-colors">Kiemiftah.Com</a>
                        </p>
                        <p className="text-[10px] text-indigo-500 mt-1 font-mono uppercase tracking-wider">
                            Last Updated on {new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' })} {hitCount ? `| Hits: ${hitCount}` : ''}
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ComixsPrompter />);
    </script>
</body>
</html>
