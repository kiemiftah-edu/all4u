<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF to H5P Converter</title>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- JSZip for creating H5P files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- PDF.js for reading PDF files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    :root {
      --bg: #050816;
      --card: #0f172a;
      --accent: #ef4444; /* Red for PDF/Adobe vibe */
      --accent-soft: rgba(239, 68, 68, 0.15);
      --accent-strong: #dc2626;
      --text-main: #e5e7eb;
      --text-muted: #94a3b8;
      --border-subtle: rgba(148, 163, 184, 0.2);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { 
      font-size: 24px; 
      font-weight: 700; 
      background: linear-gradient(to right, #fff, var(--accent)); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .header p { color: var(--text-muted); font-size: 14px; }

    .upload-zone {
      border: 2px dashed var(--border-subtle);
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-zone:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .upload-zone.active {
      border-color: var(--accent-strong);
      background: var(--accent-soft);
    }
    
    .icon-box {
      width: 48px; height: 48px;
      background: var(--card);
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: 0.2s;
    }
    .btn-primary { background: var(--accent-strong); color: white; }
    .btn-primary:hover { background: #b91c1c; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      margin-top: 10px;
    }
    .btn-outline:hover { border-color: var(--text-main); color: var(--text-main); }

    .progress-container { margin-top: 20px; }
    .progress-bar-bg {
      height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar-fill {
      height: 100%; background: var(--accent-strong); transition: width 0.3s ease;
    }
    .status-text { font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; }

    .success-box {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 16px;
      border-radius: 12px;
      margin-top: 20px;
      text-align: center;
    }
    .success-title { color: #34d399; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .success-sub { color: #a7f3d0; font-size: 12px; margin-bottom: 12px; }

    .instructions {
      margin-top: 24px;
      border-top: 1px solid var(--border-subtle);
      padding-top: 20px;
    }
    .instruction-item {
      display: flex; gap: 12px; margin-bottom: 12px; align-items: start;
    }
    .step-num {
      background: var(--card); border: 1px solid var(--border-subtle);
      width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--text-muted); flex-shrink: 0;
      margin-top: 2px;
    }
    .step-text { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
    .step-text strong { color: var(--text-main); }
    
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // --- ICONS ---
    const Upload = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    );
    const PdfIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    );
    const Check = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>
    );
    const Download = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    );
    const RefreshCw = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    );
    const Loader2 = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    );

    // --- H5P STRUCTURE ---
    const h5pJsonTemplate = {
      "title": "Presentation from PDF",
      "language": "und",
      "mainLibrary": "H5P.CoursePresentation",
      "majorVersion": 1, "minorVersion": 25,
      "embedTypes": ["div"], "license": "U", "defaultLanguage": "en",
      "preloadedDependencies": [
        { "machineName": "H5P.CoursePresentation", "majorVersion": 1, "minorVersion": 25 },
        { "machineName": "FontAwesome", "majorVersion": 4, "minorVersion": 5 },
        { "machineName": "H5P.FontIcons", "majorVersion": 1, "minorVersion": 0 },
        { "machineName": "H5P.JoubelUI", "majorVersion": 1, "minorVersion": 3 },
        { "machineName": "H5P.Transition", "majorVersion": 1, "minorVersion": 0 }
      ]
    };

    const App = () => {
      const [pdfFile, setPdfFile] = useState(null);
      const [status, setStatus] = useState('idle');
      const [progress, setProgress] = useState(0);
      const [msg, setMsg] = useState('Sedia');
      const [generatedBlob, setGeneratedBlob] = useState(null);
      const fileInputRef = useRef(null);

      // Initialize PDF.js worker
      useEffect(() => {
        if (window.pdfjsLib) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
      }, []);

      // Handle file selection
      const onFileSelect = (e) => {
        const selected = e.target.files[0];
        if (!selected) return;
        
        if (selected.type === 'application/pdf' || selected.name.toLowerCase().endsWith('.pdf')) {
            setPdfFile(selected);
            setStatus('idle');
            setProgress(0);
            setGeneratedBlob(null);
            setMsg(`Fail dipilih: ${selected.name}`);
        } else {
            alert("Sila pilih fail PDF sahaja.");
        }
      };

      const startConvert = async () => {
        if (!pdfFile) return;
        setStatus('working');
        
        // Delay slightly to allow UI update
        setTimeout(async () => {
          try {
            const zip = new JSZip();
            const slides = [];

            // --- PDF PROCESSING ---
            const arrayBuffer = await pdfFile.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument(arrayBuffer).promise;
            
            for (let i = 1; i <= pdf.numPages; i++) {
                setProgress(Math.round((i / pdf.numPages) * 90));
                setMsg(`Memproses Halaman PDF ${i} dari ${pdf.numPages}...`);
                
                const page = await pdf.getPage(i);
                // Scale 1.5 - Good balance between quality and file size for H5P
                const viewport = page.getViewport({ scale: 1.5 }); 
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                await page.render({ canvasContext: context, viewport: viewport }).promise;
                
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                const imgName = `slide_${i}.png`;
                
                zip.file(`content/images/${imgName}`, blob);
                slides.push(createSlideEntry(imgName, viewport.width, viewport.height, `Slide ${i}`));
            }

            // Write JSONs
            const mainTitle = pdfFile.name.replace(/\.[^/.]+$/, "");
            
            zip.file("content/content.json", JSON.stringify({ "presentation": { "slides": slides } }));
            zip.file("h5p.json", JSON.stringify({ ...h5pJsonTemplate, title: mainTitle }));

            // CLEANUP: Remove folder entries ending in "/" to please Moodle
            for (let key in zip.files) {
                if (key.endsWith("/")) delete zip.files[key];
            }

            setMsg("Membungkus fail H5P...");
            const blob = await zip.generateAsync({type: "blob"});
            setGeneratedBlob(blob);
            setProgress(100);
            setStatus('success');
            setMsg("Selesai!");

          } catch (e) {
            console.error(e);
            setMsg("Ralat: " + e.message);
            setStatus('idle');
          }
        }, 500);
      };

      const createSlideEntry = (filename, w, h, title) => {
        return {
          "elements": [{
            "x": 0, "y": 0, "width": 100, "height": 100,
            "action": {
              "library": "H5P.Image 1.1",
              "params": { 
                "file": { "path": `images/${filename}`, "mime": "image/png", "copyright": { "license": "U" }, "width": w, "height": h } 
              },
              "subContentId": `img-${Date.now()}-${Math.random()}`,
              "metadata": { "contentType": "Image", "license": "U", "title": title }
            }
          }]
        };
      };

      const download = () => {
        if (!generatedBlob) return;
        const url = URL.createObjectURL(generatedBlob);
        const a = document.createElement('a');
        const filename = pdfFile ? pdfFile.name.replace(/\.[^/.]+$/, "") : "presentation";
        a.href = url; 
        a.download = filename + ".h5p";
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
      };

      const reset = () => {
        setPdfFile(null); setStatus('idle'); setGeneratedBlob(null); setProgress(0); setMsg('Sedia');
        if(fileInputRef.current) fileInputRef.current.value = "";
      };

      return (
        <div className="app-container">
          <div className="card">
            <div className="header">
              <h1>PDF to H5P Converter</h1>
              <p>Tukar Fail PDF kepada H5P Course Presentation</p>
            </div>

            {/* Upload Area */}
            {!pdfFile ? (
              <div 
                className="upload-zone" 
                onClick={() => fileInputRef.current.click()}
              >
                <div className="icon-box"><Upload size={24}/></div>
                <div style={{fontWeight:500, marginBottom:4}}>Upload Fail PDF</div>
                <div style={{fontSize:12, color:'var(--text-muted)'}}>
                  Pilih fail <strong>.PDF</strong> sahaja
                </div>
                <input 
                  type="file" 
                  ref={fileInputRef} 
                  onChange={onFileSelect} 
                  accept=".pdf" 
                  style={{display:'none'}} 
                />
              </div>
            ) : (
              // File Selected State
              <div className={`upload-zone active`}>
                <div className="icon-box" style={{borderColor:'var(--accent-strong)', color:'var(--accent-strong)'}}>
                  <PdfIcon size={24}/>
                </div>
                
                <div style={{fontWeight:600, color:'var(--text-main)', marginTop:4}}>
                  {pdfFile.name}
                </div>
                <div style={{fontSize:12, color:'var(--accent-strong)'}}>
                   {(pdfFile.size / 1024 / 1024).toFixed(2)} MB • Sedia untuk ditukar
                </div>
              </div>
            )}

            {/* Actions & Progress */}
            {pdfFile && status !== 'success' && (
              <div style={{marginTop: 20}}>
                <button 
                  className="btn btn-primary" 
                  onClick={startConvert}
                  disabled={status === 'working'}
                >
                  {status === 'working' ? <><Loader2 className="animate-spin" size={18}/> Menukar PDF...</> : 'Tukar Ke H5P'}
                </button>
                {status === 'idle' && (
                  <button className="btn btn-outline" onClick={reset}>Batal</button>
                )}
              </div>
            )}

            {/* Progress Bar */}
            {status === 'working' && (
              <div className="progress-container">
                <div className="status-text">
                  <span>{msg}</span>
                  <span>{progress}%</span>
                </div>
                <div className="progress-bar-bg">
                  <div className="progress-bar-fill" style={{width: `${progress}%`}}></div>
                </div>
              </div>
            )}

            {/* Success Result */}
            {status === 'success' && (
              <div className="success-box">
                <div className="icon-box" style={{background:'transparent', border:'none', color:'#34d399', marginBottom:0}}>
                  <Check size={40} />
                </div>
                <div className="success-title">Berjaya Ditukar!</div>
                <div className="success-sub">Fail .h5p anda sudah sedia.</div>
                
                <button className="btn btn-primary" onClick={download}>
                  <Download size={18}/> Muat Turun Fail .h5p
                </button>
                <button className="btn btn-outline" onClick={reset}>
                  <RefreshCw size={16}/> Tukar Fail Lain
                </button>
              </div>
            )}

            {/* Instructions */}
            <div className="instructions">
              <div style={{fontSize:12, fontWeight:600, color:'var(--text-muted)', marginBottom:12, textTransform:'uppercase', letterSpacing:1}}>Panduan Penggunaan</div>
              <div className="instruction-item">
                <div className="step-num">1</div>
                <div className="step-text"><strong>Format:</strong> Pastikan PDF anda berformat landskap untuk paparan skrin terbaik.</div>
              </div>
              <div className="instruction-item">
                <div className="step-num">2</div>
                <div className="step-text"><strong>Upload ke Moodle:</strong> Upload fail .h5p yang dihasilkan sebagai "Interactive Content (H5P)".</div>
              </div>
            </div>

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
